<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاکسلی هولمز</title><style>
*{box-sizing:border-box}body{margin:0;background:#121d19;color:#f4ead5;font:16px Tahoma,sans-serif}main{max-width:720px;margin:auto;padding:24px}header{border-bottom:1px solid #68735e;padding-bottom:20px}h1{font-size:27px}p{line-height:1.9;color:#c8c7b6}input,select,textarea,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #64715b;background:#20332a;color:inherit}input{width:100%;direction:ltr}label{display:block;margin:16px 0 8px}button{cursor:pointer;background:#d6b66e;color:#142219}button:disabled{opacity:.5}#chat{min-height:220px;max-height:52vh;overflow:auto;padding:16px 0}.message{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;padding:14px;border-radius:14px;background:#22392d;margin:10px 0}.user{background:#394332;margin-right:35px}.assistant{margin-left:35px}textarea{width:100%;resize:vertical;min-height:80px}.row{display:flex;gap:10px;justify-content:space-between;margin-top:12px}#status{min-height:28px;color:#dfc383;line-height:1.8}small{line-height:1.8}summary{cursor:pointer;color:#d6b66e}</style>
<main><header><small>۲۲۱B • آخرین پرونده</small><h1>🦊 فاکسلی هولمز</h1><p>آخرین شاگرد مخفی شرلوک از یک رمز محافظت می‌کند. با گفت‌وگو، معما و استدلال تلاش کن آن را از او بگیری.</p></header>
<details open><summary>تنظیم اتصال آزمایشی</summary><label for="endpoint">آدرس Worker (کلید API اینجا وارد نشود)</label><input id="endpoint" placeholder="https://foxley-chat.YOUR-SUBDOMAIN.workers.dev" type="url"><small>اگر صفحه روی خود Worker باز شده، این کادر را خالی بگذار.</small></details>
<label for="level">سطح بازی</label><select id="level"><option value="easy">آسان</option><option value="medium">متوسط</option><option value="hard">سخت</option><option value="extreme">نهایی</option></select>
<section id="chat" role="log" aria-live="polite"></section><div id="status" role="status"></div><form id="form"><label for="message">پیام تو</label><textarea id="message" maxlength="1500" required placeholder="سلام فاکسلی…"></textarea><div class="row"><button id="send">ارسال پیام</button><button id="reset" type="button">شروع دوباره</button></div></form><p><small>نسخهٔ آزمایشی؛ اطلاعات شخصی وارد نکن. سقف هر گفت‌وگو ۲۰ پیام است.</small></p></main>
<script>
const $=id=>document.getElementById(id);let history=[],busy=false;
$('endpoint').value=localStorage.getItem('foxley-endpoint')||'';
function render(){ $('chat').replaceChildren();for(const m of history){const d=document.createElement('div');d.className='message '+m.role;d.textContent=m.content;$('chat').append(d)}$('chat').scrollTop=$('chat').scrollHeight}
function reset(){history=[];$('status').textContent='برای شروع، به فاکسلی سلام کن.';render()}
$('reset').onclick=reset;$('level').onchange=reset;
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const content=$('message').value.trim();if(!content)return;if(history.length>=40){$('status').textContent='این نشست تمام شد؛ دوباره شروع کن.';return}
const endpoint=$('endpoint').value.trim().replace(/\/$/,'');if(endpoint&&!endpoint.startsWith('https://')){$('status').textContent='آدرس Worker باید با https:// شروع شود.';return}localStorage.setItem('foxley-endpoint',endpoint);
busy=true;$('send').disabled=$('reset').disabled=$('level').disabled=true;history.push({role:'user',content});render();$('message').value='';$('status').textContent='فاکسلی دارد فکر می‌کند…';
try{const r=await fetch(endpoint+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({level:$('level').value,messages:history}),signal:AbortSignal.timeout(45000)});const data=await r.json();if(!r.ok)throw Error(data.error||'خطا در اتصال');history.push({role:'assistant',content:data.reply});$('status').textContent='';render()}catch(err){history.pop();$('message').value=content;render();$('status').textContent=err.message||'اتصال برقرار نشد؛ آدرس Worker را بررسی کن.'}finally{busy=false;$('send').disabled=$('reset').disabled=$('level').disabled=false}};
reset();
</script></html>
